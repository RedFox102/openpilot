# Per-platform speed-binned torque parameters (from zoompilot). Breakpoints are bin centers in
# m/s. LAF and friction seed per-bin SVD fits and their +/-sanity bounds, on the platform's own
# CarParams scale (for Mazda, the 1200-count STEER_MAX). Learned bins persist across boots.
# Increment seed_version when new seeds must invalidate existing caches and restart learning; an
# omitted version is zero. min_speed is the first bin's lower edge in m/s, 5 when omitted; slower
# points are not learned. A car without an entry is not speed-binned.

[MAZDA_CX5_2022]
# zoompilot's CX-5 2022 filtered learned values (2026-10-13) on the 1200-count STEER_MAX, every
# bin full; the 3.5 m/s crawl bin (2-5 m/s) is fit offline from that car's rlogs.
speed_bp    = [3.5, 6.5, 9.5, 12.0, 16.4, 21.0, 28.0, 34.5, 37.0]
laf_bp      = [1.80, 2.16, 2.37, 1.94, 1.69, 1.80, 1.96, 2.20, 2.31]
friction_bp = [0.220, 0.206, 0.151, 0.143, 0.140, 0.122, 0.105, 0.095, 0.085]
min_speed = 2.0
seed_version = 3

[MAZDA_CX9_2021]
# Learned on a CX-9 with a CX-5 2022 donor EPS; the stock EPS keeps the 45 kph steering floor
# and receives only the bins above it. Bins from 16.4 m/s up were learned at 800 counts and are
# converted to the 1200-count STEER_MAX exactly (LAF x 1.5, friction / 1.5).
speed_bp    = [6.5, 9.5, 12.0, 16.4, 21.0, 28.0, 35.0]
laf_bp      = [2.67, 2.70, 2.56, 2.30, 1.92, 2.58, 2.96]
friction_bp = [0.161, 0.154, 0.116, 0.109, 0.091, 0.085, 0.072]
seed_version = 1

# Chassis behind a CX-5 2022 donor EPS. They take the CX-5 2022 table, learned behind that EPS,
# until one learns its own; the stock EPS on each keeps the steering floor and gets none.
[MAZDA_CX5]
substitute = "MAZDA_CX5_2022"
requires_steer_to_zero = true

[MAZDA_CX9]
substitute = "MAZDA_CX5_2022"
requires_steer_to_zero = true

[MAZDA_3]
substitute = "MAZDA_CX5_2022"
requires_steer_to_zero = true

[MAZDA_6]
substitute = "MAZDA_CX5_2022"
requires_steer_to_zero = true
